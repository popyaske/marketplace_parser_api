services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
      POSTGRES_DB: parser
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - parser-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: marketplace-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - parser-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  parser:
    build: .
    container_name: marketplace-parser
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CDP_HOST: 192.168.65.254
      CDP_PORT: 9222
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://parser:parser@postgres:5432/parser
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - parser-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-worker
    restart: unless-stopped

    command: ["python", "worker.py"]

    expose:
      - "8080"

    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=2)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    environment:
      CDP_HOST: 192.168.65.254
      CDP_PORT: 9222
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://parser:parser@postgres:5432/parser
      LOG_LEVEL: INFO
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TAKPRODAM_API_TOKEN: ${TAKPRODAM_API_TOKEN:-}
      TAKPRODAM_SOURCE_ID: ${TAKPRODAM_SOURCE_ID:-0}
      TAKPRODAM_MARKETPLACE: ${TAKPRODAM_MARKETPLACE:-}
      TAKPRODAM_SUBID: ${TAKPRODAM_SUBID:-tg_daily}
      PUBLISH_HOUR: ${PUBLISH_HOUR:-20}
      PUBLISH_TZ_OFFSET: ${PUBLISH_TZ_OFFSET:-3}
      YANDEX_REFERRAL_INTERVAL: ${YANDEX_REFERRAL_INTERVAL:-600}
      MEDIA_ROOT: /app/media
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_USER_ID: ${VK_USER_ID:-0}
      VK_DIGEST_INTERVAL: ${VK_DIGEST_INTERVAL:-86400}
      VK_PHOTOS_PER_VIDEO: ${VK_PHOTOS_PER_VIDEO:-5}
      VK_PHOTO_DURATION: ${VK_PHOTO_DURATION:-3.0}
      VK_VIDEO_WIDTH: ${VK_VIDEO_WIDTH:-1080}
      VK_VIDEO_HEIGHT: ${VK_VIDEO_HEIGHT:-1920}
      VK_HASHTAGS: ${VK_HASHTAGS:-#скидки,#маркетплейсы,#промокоды}
      VK_HASHTAGS_COUNT: ${VK_HASHTAGS_COUNT}
      VK_CHANNEL_LINK: ${VK_CHANNEL_LINK:-https://t.me/PromoMP1}
      VK_HASHTAGS_SOURCE: ${VK_HASHTAGS_SOURCE}
      VK_TRENDING_PAGES: ${VK_TRENDING_PAGES}
      VK_TRENDING_REFRESH_SEC: ${VK_TRENDING_REFRESH_SEC}
        
      # === VK Stories ===
      VK_PUBLISH_STORY: ${VK_PUBLISH_STORY:-0}
      VK_STORY_GROUP_ID: ${VK_STORY_GROUP_ID:-0}
      VK_STORY_LINK_TEXT: ${VK_STORY_LINK_TEXT:-more}
      VK_STORY_LINK_URL: ${VK_STORY_LINK_URL:-}

      YANDEX_AUTO_REFERRAL: ${YANDEX_AUTO_REFERRAL:-1}

      YANDEX_REFERRAL_MAX_PAGES: ${YANDEX_REFERRAL_MAX_PAGES:-30}
      YANDEX_REFERRAL_EMPTY_STREAK: ${YANDEX_REFERRAL_EMPTY_STREAK:-3}
      YANDEX_REFERRAL_TARGET_FRESH: ${YANDEX_REFERRAL_TARGET_FRESH:-10}

    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - parser-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./photos:/app/media/photos
      - ./videos:/app/media/videos
      - ./music:/app/media/music
      - ./fonts:/app/fonts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - parser
    networks:
      - parser-network

networks:
  parser-network:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data: